version: '3.9'

services:
  auth-db:
    image: postgres:16
    container_name: auth-db
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  auth-service:
    build: .
    container_name: auth-service
    restart: always
    env_file: .env
    depends_on:
      - auth-db
    ports:
      - "8082:8082"

volumes:
  auth-db-data:
